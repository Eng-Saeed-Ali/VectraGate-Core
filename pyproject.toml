[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vectragate-core"
version = "1.0.0"
description = "VectraGate-Core (بَرْزَخ) — Deterministic OT/ICS Protocol Firewall, Combinational Logic-Gate Interlock Engine & Cryptographic SIEM Audit Plane"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
    { name = "Saeed Engineering Canon Architecture Team" }
]
dependencies = [
    "duckdb>=1.0.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.100.0",
    "pytest>=8.0.0",
]

[project.scripts]
vectragate = "vectragate.cli_visualizer:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --tb=short"
