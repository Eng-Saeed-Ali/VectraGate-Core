  <path d="M 320 390 L 374 435" fill="none" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#arrow-cyan)"/>
  <path d="M 555 320 L 555 344" fill="none" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrow-emerald)"/>
